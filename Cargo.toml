[workspace]
resolver = "2"
members = ["crates/cs-archive", "crates/cs-core", "crates/cs-import", "crates/cs-tui", "crates/cs"]
# The PoC is a throwaway measurement instrument kept for its results, not part of the
# product. Excluding it keeps its pinned deps out of the workspace lockfile.
exclude = ["poc/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.89 for `std::fs::File::try_lock`, which is how `cs-core::build` tells a rebuild that is
# still running from one that was killed. The alternatives were a new dependency for `flock`
# or a timeout guessed at, and neither is worth a version floor nothing enforces.
rust-version = "1.89"

# Pinned once here so the two crates cannot drift apart on a shared type.
[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"
globset = "0.4"
reflink-copy = "0.1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
# `clock` is the whole reason this is here — reading the machine's zone. Everything else
# chrono offers by default (wasm bindings, its own serde impls, locales) is dead weight.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Dev-only, everywhere: pinning a named zone is what makes DST behaviour testable off a
# machine that happens to sit in the right timezone. Production reads the system zone.
chrono-tz = "0.10"
# ratatui re-exports crossterm, so the backend is never a separate version to keep in step.
ratatui = { version = "0.30", features = ["crossterm"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
